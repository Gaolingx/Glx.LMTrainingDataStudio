name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore LMTrainingDataStudio2/LMTrainingDataStudio2.slnx

      - name: Build
        run: dotnet build LMTrainingDataStudio2/LMTrainingDataStudio2.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test LMTrainingDataStudio2/LMTrainingDataStudio2.slnx
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore