name: release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match Directory.Build.props)
        required: true
        default: '1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $source = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $version = $source.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release version '$source' must be a three-part semantic version such as 1.2.3."
          }

          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') {
              throw "Directory.Build.props does not declare <Version>."
          }

          if ($Matches[1].Trim() -ne $version) {
              throw "Release version '$version' does not match Directory.Build.props version '$($Matches[1].Trim())'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore LMTrainingDataStudio2/LMTrainingDataStudio2.slnx

      - name: Verify formatting
        run: dotnet format LMTrainingDataStudio2/LMTrainingDataStudio2.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LMTrainingDataStudio2/LMTrainingDataStudio2.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test LMTrainingDataStudio2/LMTrainingDataStudio2.slnx
          -c Release --no-build
          --logger "trx;LogFileName=release-tests.trx"
          --results-directory artifacts/release-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: artifacts/release-tests
          if-no-files-found: ignore

  package:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [validate, verify]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore LMTrainingDataStudio2/LMTrainingDataStudio2.slnx

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Publish win-x64
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/publish-win-x64.ps1
          -Configuration Release -Version ${{ needs.validate.outputs.version }}

      - name: Build MSIX
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/package-msix.ps1
          -Version ${{ needs.validate.outputs.version }}

      - name: Build Inno installer
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/package-inno.ps1
          -SkipPublish -Version ${{ needs.validate.outputs.version }}

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $version = "${{ needs.validate.outputs.version }}"
          Copy-Item "artifacts/publish/win-x64-$version.zip" artifacts/release/
          Copy-Item "artifacts/msix/LLMTrainingDataStudio-$version.0.msix" artifacts/release/ -ErrorAction SilentlyContinue
          Copy-Item "artifacts/installer/LMTrainingDataStudio-Setup-$version.exe" artifacts/release/
          Get-ChildItem artifacts/release | Format-Table Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/release
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $files = Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { throw "No release artifacts were produced." }
          gh release create "v$version" @files --generate-notes --title "v$version"
